<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brewing Chapters · Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
body{background:#f5f5f3;color:#1a1a1a;font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px}
.header{padding:1.25rem 1rem 1rem;background:#fff;border-bottom:1px solid #e8e8e8;display:flex;justify-content:space-between;align-items:flex-start}
.page-name{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;line-height:1.1}
.sub1{font-size:13px;color:#555;margin-top:2px}
.sub2{font-size:11px;color:#999;margin-top:6px}
.live-badge{display:inline-flex;align-items:center;gap:5px;background:#edf7f2;color:#0d7a4a;font-size:10px;font-weight:600;padding:4px 10px;border-radius:20px;margin-top:6px}
.live-dot{width:6px;height:6px;border-radius:50%;background:#0d7a4a;animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.section{padding:1rem;border-bottom:1px solid #e8e8e8}
.section-title{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.s-blue{background:#eef4fd}.s-blue .section-title{color:#1a5fad}
.s-green{background:#edf7f2}.s-green .section-title{color:#0d7a4a}
.s-purple{background:#f0eefb}.s-purple .section-title{color:#4535b0}
.s-amber{background:#fdf6e8}.s-amber .section-title{color:#a07000}
.s-pink{background:#fceef4}.s-pink .section-title{color:#b5366a}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat-box{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:12px}
.stat-val{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;line-height:1}
.stat-label{font-size:11px;color:#999;margin-top:4px}
.pod{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #e0e0e0}
.pod:last-child{border-bottom:none;padding-bottom:0}
.pod-rank{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:#999;width:16px;flex-shrink:0}
.pod-title{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod-stats{font-size:10px;color:#999;margin-top:2px}
.pod-views{font-size:15px;font-weight:600;color:#0d7a4a;flex-shrink:0}
.chart-wrap{position:relative;height:160px}
.post{padding:12px 0;border-bottom:1px solid #ecd9e2}
.post:last-child{border-bottom:none;padding-bottom:0}
.post-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.post-title{font-size:12px;font-weight:600;flex:1;margin-right:8px;line-height:1.4}
.post-date{font-size:10px;color:#999;flex-shrink:0}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.m-val{font-size:13px;font-weight:600;display:block}
.m-val.g{color:#0d7a4a}.m-val.r{color:#c0392b}
.m-label{font-size:9px;color:#999;margin-top:1px}
.note{background:#fff8e8;border:1px solid #f0dca8;border-radius:10px;padding:12px;margin:12px 1rem;font-size:12px;color:#7a5a00;line-height:1.5}
.error-box{background:#fff5f5;border:1px solid #ffd0d0;border-radius:12px;padding:16px;margin:16px;font-size:13px;color:#c0392b;line-height:1.6}
.loading{text-align:center;padding:48px 20px;color:#999;font-size:14px}
.refresh-btn{position:fixed;bottom:20px;right:16px;background:#1a1a1a;color:#fff;border:none;border-radius:50px;padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;box-shadow:0 4px 12px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="header">
  <div>
    <div class="page-name">Brewing Chapters</div>
    <div class="sub1">Analytics Dashboard</div>
    <div class="sub2">brewing__chapters · Bengaluru</div>
  </div>
  <div style="text-align:right">
    <div style="font-size:10px;color:#999" id="dateLabel"></div>
    <div class="live-badge"><span class="live-dot"></span> Live</div>
  </div>
</div>
<div id="main"><div class="loading">Fetching live data from Instagram...</div></div>
<button class="refresh-btn" onclick="load()">↻ Refresh</button>

<script>
var WORKER = "https://blue-flower-2ef4.rupashiohri.workers.dev";
var T = { saves: 10, sends: 10, watch: 12, lowWatch: 7, lowViews: 100 };
var charts = [];

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(1).replace(".0", "") + "K" : String(n); }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString("en-IN", { day: "numeric", month: "short" }) : ""; }
function title(c) { var t = String(c || "").split("\n")[0].trim(); return t.length > 70 ? t.substring(0, 67) + "..." : (t || "Untitled post"); }
function sum(arr, k) { return arr.reduce(function (s, p) { return s + (p[k] || 0); }, 0); }

function flag(kind, p) {
  if (kind === "saves") return p.saves >= T.saves ? "g" : (p.saves <= 1 ? "r" : "");
  if (kind === "sends") return p.sends >= T.sends ? "g" : (p.sends <= 1 ? "r" : "");
  if (kind === "watch") return p.watch >= T.watch ? "g" : (p.watch > 0 && p.watch < T.lowWatch ? "r" : "");
  if (kind === "views") return p.views < T.lowViews ? "r" : "";
  return "";
}

function load() {
  charts.forEach(function (c) { c.destroy(); });
  charts = [];
  document.getElementById("dateLabel").textContent = new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" });
  fetch(WORKER).then(function (r) { return r.json(); }).then(function (d) {
    if (d.error) throw new Error(d.error);
    render(d);
  }).catch(function (e) {
    document.getElementById("main").innerHTML = '<div class="error-box">Could not load data: ' + esc(e.message) + '</div>';
  });
}

function render(d) {
  var posts = d.posts || [];
  var byViews = posts.slice().sort(function (a, b) { return b.views - a.views; });
  var chrono = posts.slice().sort(function (a, b) { return new Date(a.date) - new Date(b.date); });
  var recent = posts.slice().sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
  var withWatch = posts.filter(function (p) { return p.watch > 0; });
  var avgWatch = withWatch.length ? Math.round(sum(withWatch, "watch") / withWatch.length) : 0;
  var html = "";

  var allZero = posts.length && posts.every(function (p) { return p.views === 0 && p.saves === 0; });
  if (allZero) {
    var err = (posts.find(function (p) { return p.insight_error; }) || {}).insight_error;
    html += '<div class="note">Instagram returned no insight numbers.' + (err ? " Message: " + esc(err) : "") + '</div>';
  }

  html += '<div class="section s-blue"><div class="section-title">Page overview</div><div class="stat-grid">' +
    '<div class="stat-box"><div class="stat-val">' + fmt(sum(posts, "views")) + '</div><div class="stat-label">Total views</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + fmt(d.followers || 0) + '</div><div class="stat-label">Followers</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + sum(posts, "saves") + '</div><div class="stat-label">Total saves</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + sum(posts, "sends") + '</div><div class="stat-label">Total sends</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + avgWatch + 's</div><div class="stat-label">Avg watch time</div></div>' +
    '<div class="stat-box"><div class="stat-val">' + fmt(sum(posts, "likes")) + '</div><div class="stat-label">Total likes</div></div>' +
    '</div></div>';

  html += '<div class="section s-green"><div class="section-title">Top performers</div>';
  byViews.slice(0, 3).forEach(function (p, i) {
    html += '<div class="pod"><div class="pod-rank">' + (i + 1) + '</div><div style="flex:1;min-width:0">' +
      '<div class="pod-title">' + esc(title(p.caption)) + '</div>' +
      '<div class="pod-stats">' + p.saves + ' saves · ' + p.sends + ' sends · ' + p.watch + 's watch</div></div>' +
      '<div class="pod-views">' + fmt(p.views) + '</div></div>';
  });
  html += '</div>';

  html += '<div class="section s-purple"><div class="section-title">Views over time</div><div class="chart-wrap"><canvas id="vc"></canvas></div></div>';
  html += '<div class="section s-amber"><div class="section-title">Watch time trend</div><div class="chart-wrap"><canvas id="wc"></canvas></div></div>';

  html += '<div class="section s-pink"><div class="section-title">All posts</div>';
  recent.forEach(function (p) {
    html += '<div class="post"><div class="post-top"><div class="post-title">' + esc(title(p.caption)) + '</div><div class="post-date">' + fmtDate(p.date) + '</div></div>' +
      '<div class="metrics">' +
      '<div><span class="m-val ' + flag("views", p) + '">' + fmt(p.views) + '</span><div class="m-label">Views</div></div>' +
      '<div><span class="m-val ' + flag("saves", p) + '">' + p.saves + '</span><div class="m-label">Saves</div></div>' +
      '<div><span class="m-val ' + flag("sends", p) + '">' + p.sends + '</span><div class="m-label">Sends</div></div>' +
      '<div><span class="m-val">' + p.likes + '</span><div class="m-label">Likes</div></div>' +
      '<div><span class="m-val ' + flag("watch", p) + '">' + p.watch + 's</span><div class="m-label">Watch</div></div>' +
      '</div></div>';
  });
  html += '</div>';

  document.getElementById("main").innerHTML = html;

  var muted = "#aaa", grid = "#e0dede", labels = chrono.map(function (p) { return fmtDate(p.date); });
  var scales = function (cb) {
    return {
      x: { ticks: { color: muted, font: { size: 8 }, maxRotation: 45, autoSkip: false }, grid: { display: false }, border: { display: false } },
      y: { ticks: { color: muted, font: { size: 9 }, callback: cb }, grid: { color: grid }, border: { display: false } }
    };
  };
  charts.push(new Chart(document.getElementById("vc"), {
    type: "bar",
    data: { labels: labels, datasets: [{ data: chrono.map(function (p) { return p.views; }), backgroundColor: "#6250d6", borderRadius: 4, borderSkipped: false }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: scales(function (v) { return v >= 1000 ? (v / 1000) + "K" : v; }) }
  }));
  charts.push(new Chart(document.getElementById("wc"), {
    type: "line",
    data: { labels: labels, datasets: [{ data: chrono.map(function (p) { return p.watch; }), borderColor: "#eda100", backgroundColor: "rgba(237,161,0,.08)", tension: .4, pointBackgroundColor: "#eda100", pointRadius: 4, fill: true }] },
    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: scales(function (v) { return v + "s"; }) }
  }));
}

load();
</script>
</body>
</html>
